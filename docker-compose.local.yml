# Version alternative avec MongoDB local (sans Atlas)
# Utilisation : docker-compose -f docker-compose.local.yml up --build

services:
  # Base de données MongoDB locale
  mongo:
    image: mongo:7
    container_name: todo-mongo
    restart: unless-stopped
    environment:
      MONGO_INITDB_ROOT_USERNAME: admin
      MONGO_INITDB_ROOT_PASSWORD: password123
    ports:
      - "27017:27017"
    volumes:
      - mongo-data:/data/db
    networks:
      - todo-network

  # Backend Node.js/Express
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: todo-backend
    restart: unless-stopped
    ports:
      - "5000:5000"
    environment:
      # URI MongoDB pointant vers le service 'mongo' local
      MONGO_URI: mongodb://admin:password123@mongo:27017/todoapp?authSource=admin
      JWT_SECRET: ${JWT_SECRET:-your-secret-key-change-in-production}
      PORT: 5000
      CLIENT_URL: http://localhost:3000
    depends_on:
      - mongo
    networks:
      - todo-network

  # Frontend React (build + Nginx)
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: todo-frontend
    restart: unless-stopped
    ports:
      - "3000:80"
    depends_on:
      - backend
    networks:
      - todo-network

# Volumes persistants
volumes:
  mongo-data:

# Réseau interne
networks:
  todo-network:
    driver: bridge
