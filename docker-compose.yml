services:
  # Backend Node.js/Express
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: todo-backend
    restart: unless-stopped
    ports:
      - "5000:5000"
    environment:
      # MongoDB Atlas (cloud) - utilise les credentials du .env
      MONGO_URI: ${MONGO_URI}
      JWT_SECRET: ${JWT_SECRET}
      PORT: 5000
      CLIENT_URL: http://localhost:3000
    networks:
      - todo-network

  # Frontend React (build + Nginx)
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: todo-frontend
    restart: unless-stopped
    ports:
      - "3000:80"
    depends_on:
      - backend
    networks:
      - todo-network

# Réseau interne pour la communication entre conteneurs
networks:
  todo-network:
    driver: bridge
